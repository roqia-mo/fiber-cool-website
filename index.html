<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فايبير كول | Fiber Cool</title>
    
    <!-- استدعاء خط Cairo من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- استدعاء مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --dark-blue: #002855;
            --light-blue: #00aae7;
            --bg-color: #f4f9ff;
            --text-gray: #4a5568;
        }

        /* خاصية التنقل الناعم بين الأقسام */
        html {
            scroll-behavior: smooth;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffffff 0%, var(--bg-color) 100%);
            color: var(--dark-blue);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- شريط التنقل --- */
        nav {
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo img {
            height: 100px; 
            object-fit: contain;
        }

        /* زر القائمة في الجوال */
        .menu-toggle {
            display: none;
            font-size: 1.8rem;
            color: var(--dark-blue);
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .menu-toggle:hover {
            transform: scale(1.1);
            color: var(--light-blue);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .nav-links li a {
            text-decoration: none;
            color: var(--dark-blue);
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links li a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            background-color: var(--light-blue);
            bottom: -5px;
            right: 0;
            transition: width 0.3s ease;
        }

        .nav-links li a:hover {
            color: var(--light-blue);
        }

        .nav-links li a:hover::after {
            width: 100%;
        }

        /* --- الواجهة الرئيسية (التفاعلية) --- */
        .hero {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: space-between;
            padding: 40px 5%;
            gap: 40px;
        }

        /* حركة دخول النص (Fade In Right) */
        .hero-content {
            flex: 1;
            max-width: 600px;
            animation: fadeInRight 1s ease-out forwards;
            opacity: 0;
        }

        .hero-title-en {
            font-family: 'Arial', sans-serif;
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 20px;
            position: relative;
        }

        .hero-title-en .dark { color: var(--dark-blue); font-weight: 900; text-transform: uppercase; }
        .hero-title-en .light { color: var(--light-blue); font-weight: 700; }

        .title-divider {
            width: 80px;
            height: 4px;
            background-color: var(--light-blue);
            margin: 20px 0;
            position: relative;
        }

        .hero-subtitle {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-gray);
            line-height: 1.5;
            margin-bottom: 40px;
        }

        /* --- المميزات التفاعلية --- */
        .features {
            display: flex;
            gap: 30px;
            margin-top: 30px;
        }

        .feature-item {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 15px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .feature-item:hover {
            transform: translateY(-10px);
            background-color: #ffffff;
            box-shadow: 0 10px 20px rgba(0, 170, 231, 0.1);
        }

        .feature-item i { 
            font-size: 2rem; 
            color: var(--light-blue); 
            transition: transform 0.3s ease;
        }
        
        .feature-item:hover i {
            transform: scale(1.2);
        }

        .feature-item span { font-size: 0.9rem; font-weight: 700; color: var(--dark-blue); }

        /* --- صورة المنتج التفاعلية --- */
        .hero-image {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: fadeInRight 1s ease-out forwards; /* الصورة أيضاً تدخل بنفس الحركة */
            opacity: 0;
        }

        /* حركة الصورة العائمة (Floating) */
        .hero-image img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 40, 85, 0.1);
            animation: float 4s ease-in-out infinite;
        }

        /* --- الحركات (Keyframes) --- */
        @keyframes fadeInRight {
            0% { opacity: 0; transform: translateX(50px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* --- الفوتر --- */
        footer {
            background-color: #ffffff;
            border-top: 2px solid rgba(0, 170, 231, 0.2);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--dark-blue);
            margin-top: auto;
        }

        .footer-info { display: flex; gap: 30px; align-items: center; }
        .footer-info a { text-decoration: none; color: var(--dark-blue); transition: color 0.3s ease; }
        .footer-info a:hover { color: var(--light-blue); }
        .footer-info .divider { color: var(--light-blue); }
        .catalog-year { color: var(--light-blue); }

        /* --- تعديلات الموبايل --- */
        @media (max-width: 992px) {
            .menu-toggle {
                display: block;
            }
            
            .nav-links {
                display: none; 
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: #ffffff;
                flex-direction: column;
                gap: 15px;
                text-align: center;
                padding: 20px 0;
                box-shadow: 0 10px 10px rgba(0, 0, 0, 0.05);
            }
            
            .nav-links.active {
                display: flex;
                animation: fadeInRight 0.3s ease-out;
            }

            .hero { flex-direction: column; text-align: center; }
            .features { justify-content: center; }
            footer { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <img src="logo (1).png" alt="Fiber Cool Logo">
        </div>
        
        <div class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </div>

        <ul class="nav-links" id="navLinks">
            <li><a href="index.html#hero" onclick="closeMenu()">الرئيسية</a></li>
            <li><a href="about.html" onclick="closeMenu()">من نحن</a></li>
            <li><a href="cooling-solutions.html" onclick="closeMenu()">حلول التبريد</a></li>
            <li><a href="air-systems.html" onclick="closeMenu()">أنظمة التوزيع</a></li>
            <li><a href="partners.html" onclick="closeMenu()">شركاء النجاح</a></li>
            <li><a href="contact.html" onclick="closeMenu()">اتصل بنا</a></li>
        </ul>
    </nav>

    <header class="hero" id="hero">
        <div class="hero-content">
            <div class="hero-title-en">
                <div class="dark">WEBSITE</div>
                <div class="light">Fiber Cool</div>
            </div>
            
            <div class="title-divider"></div>
            
            <div class="hero-subtitle">
                حلول تبريد وتهوية <br> للمصانع والمستودعات والمنشآت
            </div>

            <div class="features">
                <div class="feature-item">
                    <i class="fa-solid fa-wind"></i>
                    <span>هواء نقي منعش</span>
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-recycle"></i>
                    <span>توفير الطاقة</span>
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-leaf"></i>
                    <span>كفاءة عالية</span>
                </div>
            </div>
        </div>

        <div class="hero-image">
            <img src="1 pepr.png" alt="Fiber Cool Unit">
        </div>
    </header>

    <footer id="footer-contact">
        <div class="footer-info">
            <a href="mailto:FIPERCOOL25@GMAIL.COM"><i class="fa-regular fa-envelope"></i> FIPERCOOL25@GMAIL.COM</a>
            <span class="divider">|</span>
            <a href="tel:0503439476"><i class="fa-solid fa-phone"></i> 0503439476</a>
        </div>
        <div class="catalog-year">WEBSITE 2026</div>
    </footer>

    <script>
        const navLinks = document.getElementById('navLinks');
        
        function toggleMenu() {
            navLinks.classList.toggle('active');
        }

        function closeMenu() {
            if (window.innerWidth <= 992) {
                navLinks.classList.remove('active');
            }
        }
    </script>
</body>
</html>
